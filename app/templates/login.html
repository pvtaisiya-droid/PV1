<!doctype html>
<html lang="{{ request.state.lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход · {{ _('PV System') }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='style.css') }}?v=20260818-auth" rel="stylesheet">
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="login-title">
            <div class="auth-brand">
                <img src="{{ url_for('static', path='brand/ars-pharmrussia-logo.png') }}" alt="ARS PharmRussia">
                <div>
                    <div class="auth-product">{{ _('PV System') }}</div>
                    <div class="text-secondary small">Система фармаконадзора</div>
                </div>
            </div>

            <h1 class="h4 mb-3" id="login-title">Вход в систему</h1>

            <div class="alert alert-info" role="status">
                Пожалуйста, запросите доступ у администратора системы
                <a class="alert-link" href="mailto:pv@pharmrussia.com">pv@pharmrussia.com</a>
            </div>

            {% if error %}
            <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login" class="d-grid gap-3">
                <input type="hidden" name="next_url" value="{{ next_url }}">
                <div>
                    <label class="form-label" for="login">Логин</label>
                    <input class="form-control" id="login" name="login" value="{{ login }}" autocomplete="username" autofocus required>
                </div>
                <div>
                    <label class="form-label" for="password">Пароль</label>
                    <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary" type="submit">Войти</button>
            </form>
        </section>
    </main>
</body>
</html>
