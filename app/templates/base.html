<!doctype html>
<html lang="{{ request.state.lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ _('PV MVP') }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg border-bottom bg-white sticky-top">
    <div class="container-fluid app-shell">
        <a class="navbar-brand" href="/" aria-label="ARS PharmRussia PV MVP">
            <img class="brand-logo" src="{{ url_for('static', path='brand/ars-pharmrussia-logo.png') }}" alt="ARS PharmRussia">
            <span class="brand-product">{{ _('PV MVP') }}</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/">{{ _('Dashboard') }}</a></li>
                <li class="nav-item"><a class="nav-link {% if active_page == 'safety_reports' %}active{% endif %}" href="/safety-reports">{{ _('Safety Reports') }}</a></li>
                <li class="nav-item"><a class="nav-link {% if active_page == 'cases' %}active{% endif %}" href="/cases">{{ _('Cases') }}</a></li>
                <li class="nav-item"><a class="nav-link {% if active_page == 'partners' %}active{% endif %}" href="/partners">{{ _('Partners') }}</a></li>
                <li class="nav-item"><a class="nav-link {% if active_page == 'products' %}active{% endif %}" href="/products">{{ _('Products') }}</a></li>
                <li class="nav-item"><a class="nav-link {% if active_page == 'submissions' %}active{% endif %}" href="/submissions">{{ _('Submissions') }}</a></li>
            </ul>
            <div class="d-flex flex-wrap align-items-center gap-2">
                <div class="btn-group btn-group-sm language-switch" role="group" aria-label="Language">
                    <a class="btn btn-outline-secondary {% if request.state.lang == 'ru' %}active{% endif %}" href="{{ lang_url('ru') }}">RU</a>
                    <a class="btn btn-outline-secondary {% if request.state.lang == 'en' %}active{% endif %}" href="{{ lang_url('en') }}">EN</a>
                </div>
                <a class="btn btn-outline-secondary btn-sm icon-button" href="/docs" title="{{ _('API docs') }}">
                    <i data-lucide="book-open"></i><span>{{ _('API') }}</span>
                </a>
            </div>
        </div>
    </div>
</nav>

<main class="container-fluid app-shell py-4">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
    if (window.lucide) {
        window.lucide.createIcons();
    }
</script>
</body>
</html>
